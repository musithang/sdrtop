# A workspace only: `monas`, the engine, the `monas-*` crates it is made of,
# and the two programs built on it:
# `sdrtop`, the terminal, and `monasd`, the engine with no screen.
# Every member takes its version, edition, toolchain floor and licence from
# here, and its internal dependencies from `[workspace.dependencies]`, so a
# version bump edits this file and nothing else.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.8.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/musithang/sdrtop"
# Measured, not guessed: `slice::as_chunks` (hot path, `hardware/process.rs` and
# `signal/demod`) stabilised in 1.88.0 and `u32::is_multiple_of` in 1.87.0. The
# README claimed 1.78 for years, which is the *lockfile* floor - a toolchain
# between the two compiles the lockfile and then fails on the source.
rust-version = "1.88"
authors = ["MusiThang <viktor.laszlo92@protonmail.com>"]

# The internal crates are pinned exactly, at the workspace's own version:
# a version of one works with the same version of the others and no other.
# The test `the_internal_pins_are_the_workspace_version` fails when a bump
# misses one.
[workspace.dependencies]
monas = { path = "crates/monas", version = "=0.8.1" }
monas-bt = { path = "crates/monas-bt", version = "=0.8.1" }
monas-demod = { path = "crates/monas-demod", version = "=0.8.1" }
monas-dsp = { path = "crates/monas-dsp", version = "=0.8.1" }
monas-ft8 = { path = "crates/monas-ft8", version = "=0.8.1" }
monas-pocsag = { path = "crates/monas-pocsag", version = "=0.8.1" }
monas-rds = { path = "crates/monas-rds", version = "=0.8.1" }
monas-ble = { path = "crates/monas-ble", version = "=0.8.1" }
monas-spectrum = { path = "crates/monas-spectrum", version = "=0.8.1" }
monas-wifi = { path = "crates/monas-wifi", version = "=0.8.1" }

ratatui = "0.30"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
toml  = "1"
serde_json = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_mangen = "0.3"
crossbeam-channel = "0.5"
rustfft = "6"
num-complex = "0.4"
# HackRF, RTL-SDR and SoapySDR runtimes are optional
libloading = "0.9"
serialport = { version = "4", default-features = false }
# monasd's API: HTTP and a WebSocket, pure Rust, on the tokio runtime
# already here. Only the pieces used.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query", "ws"] }
# The API's tests drive the router in memory, with no socket.
tower = { version = "0.5", features = ["util"] }

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# The engine and its signal crates are optimised in a dev build too, so a dev
# build runs the DSP at a usable rate on a real radio: at the default level
# the intake digests 20 Msps where a HackRF sends 20, and the NET receivers
# run 12 to 100 times slower than the air. Measured, against the release
# build: the hot path at 85 to 95 % of its rate, the NET receive chain at
# the same load. Debug assertions and overflow checks stay on for them, which
# the tests rely on. The cost is in the build: a full dev build of the
# workspace takes about four times as long, the test suite builds slower and
# runs six times faster, and an edit to one panel or one decoder rebuilds as
# fast as before.

[profile.dev.package.monas]
opt-level = 3

[profile.dev.package.monas-dsp]
opt-level = 3

[profile.dev.package.monas-spectrum]
opt-level = 3

[profile.dev.package.monas-demod]
opt-level = 3

[profile.dev.package.monas-rds]
opt-level = 3

[profile.dev.package.monas-wifi]
opt-level = 3

[profile.dev.package.monas-ble]
opt-level = 3

[profile.dev.package.monas-bt]
opt-level = 3

[profile.dev.package.monas-ft8]
opt-level = 3

[profile.dev.package.monas-pocsag]
opt-level = 3

# Fat LTO since the engine became crates: thin LTO internalises less across
# crate boundaries, and the release sdrtop grew from 11.2 to 13.5 MB with the
# split. Measured on one machine, one day: fat brings it to 10.7 MB, the hot
# path and the NET receive chain run at the same rate, and a release build
# from nothing takes 248 s instead of 232.
#
# A profile here does not travel with a published crate: `cargo install`
# builds with Cargo's own release settings (as fast, measured, but unstripped
# and twice the size). packaging/install.sh asks for `strip` and `panic` on
# its source path, and a test holds the two to this profile.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
