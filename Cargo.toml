[package]
name = "sdrtop"
version = "0.3.5"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Terminal monitor for HackRF One and RTL-SDR: live spectrum, waterfall, and IQ/RF/timing/signal diagnostics"
repository = "https://github.com/mustang6139/sdrtop"
homepage = "https://github.com/mustang6139/sdrtop"
readme = "README.md"
keywords = ["sdr", "hackrf", "rtl-sdr", "radio", "tui"]
categories = ["command-line-utilities", "hardware-support", "science"]
# Measured, not guessed: `slice::as_chunks` (hot path, `hardware/process.rs` and
# `signal/demod`) stabilised in 1.88.0 and `u32::is_multiple_of` in 1.87.0. The
# README claimed 1.78 for years, which is the *lockfile* floor - a toolchain
# between the two compiles the lockfile and then fails on the source.
rust-version = "1.88"
authors = ["MusiThang <viktor.laszlo92@protonmail.com>"]

# ── Debian packaging ────────────────────────────────────────────────────────
# `cargo deb` reads this. See dev_docs/release-packaging-plan.md for why each
# field is what it is.
[package.metadata.deb]
maintainer = "MusiThang <viktor.laszlo92@protonmail.com>"
section = "hamradio"
priority = "optional"
# A hand-written DEP-5 copyright, not `LICENSE` itself: pointing this at the GPL
# text copies all 35 kB into the package, which Debian policy forbids
# (`copyright-file-contains-full-gpl-license`). The file below states the terms
# and refers to /usr/share/common-licenses/GPL-3, where the text already is on
# every Debian system, and carries the copyright year that cargo-deb's generated
# stub leaves out.
license-file = ["debian/copyright", "0"]
# Derived by `dpkg-shlibdeps` from the linked binary, not hand-written: the
# result is whatever this build host calls the libraries sdrtop actually needs,
# which differs between releases (Ubuntu 24.04 has `librtlsdr2`, older Debian
# `librtlsdr0`). A hand-written list would be wrong on half the targets.
#
# It also solves device permissions for free: `libhackrf0` and `librtlsdr2` ship
# the udev rules (`/usr/lib/udev/rules.d/60-lib*.rules`), so depending on them
# brings the rules along. Verified with `dpkg -L`, not assumed. The rules grant
# `GROUP="plugdev"`, so the user still has to be in that group - which is a
# README note, not something a package may do on their behalf.
# Debian policy wants a changelog in every non-native package. One honest entry:
# this is the first release that ships as a package at all.
changelog = "debian/changelog"
depends = "$auto"
extended-description = """sdrtop streams live diagnostics from an SDR into the terminal: spectrum and waterfall plots, IQ constellation and imbalance, RF gain-chain staging with Friis noise figure, real-time callback timing, FM/RDS demodulation and a frequency sweep. Layouts and colour themes are TOML files you can write yourself.

Supports the HackRF One and RTL-SDR (R820T/R828D/E4000) in normal receive and in observer mode, where another process holds the radio."""
assets = [
    ["target/release/sdrtop", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/sdrtop/README.md", "644"],
    # Into a subdirectory: `user_docs/README.md` is the guide's index and would
    # otherwise land on the project README at the same path.
    ["user_docs/*.md", "usr/share/doc/sdrtop/user_docs/", "644"],
]

[[bin]]
name = "sdrtop"
path = "src/main.rs"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
toml  = "0.8"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
rustfft = "6"
num-complex = "0.4"

[build-dependencies]
pkg-config = "0.3"

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"