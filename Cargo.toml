[package]
name = "sdrtop"
version = "0.4.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Terminal monitor for HackRF One and RTL-SDR: live spectrum, waterfall, and IQ/RF/timing/signal diagnostics"
repository = "https://github.com/mustang6139/sdrtop"
homepage = "https://github.com/mustang6139/sdrtop"
readme = "README.md"
keywords = ["sdr", "hackrf", "rtl-sdr", "radio", "tui"]
categories = ["command-line-utilities", "hardware-support", "science"]
# Measured, not guessed: `slice::as_chunks` (hot path, `hardware/process.rs` and
# `signal/demod`) stabilised in 1.88.0 and `u32::is_multiple_of` in 1.87.0. The
# README claimed 1.78 for years, which is the *lockfile* floor - a toolchain
# between the two compiles the lockfile and then fails on the source.
rust-version = "1.88"
authors = ["MusiThang <viktor.laszlo92@protonmail.com>"]

# What `cargo publish` must not carry. crates.io caps a crate at 10 MB and
# `user_docs/pics` alone is 18 MB of it, 15.8 of which is a single demo
# `video.mp4`: without this the publish is rejected outright, not merely
# wasteful. The rest is build and release plumbing that a source package has no
# use for. `user_docs/*.md` deliberately stays, being small and worth having
# offline beside the binary.
#
# Consequence, and the reason README.md addresses its screenshots by absolute
# URL rather than a relative path: the images are not in the package, so a
# relative `src` would render broken on the crates.io page.
exclude = [
    "user_docs/pics",
    "packaging",
    ".github",
    "dev_docs",
]

[[bin]]
name = "sdrtop"
path = "src/main.rs"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
toml  = "0.8"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
rustfft = "6"
num-complex = "0.4"
# SoapySDR is opened at runtime rather than linked, so a machine without it runs
# exactly the binary it runs today and simply sees no Soapy devices. See
# dev_docs/soapy-design.md, decision 1.
libloading = "0.8"

[build-dependencies]
pkg-config = "0.3"
# The man page is generated from the same `Parser` derive `main.rs` parses with,
# so it cannot describe a flag the binary does not have. See `src/cli.rs`.
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.2"

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"