name: Release

# Deliberately separate from ci.yaml. That runs on every push and must stay
# fast; this runs once per tag and builds the release tarball in a Debian 12
# container, for the glibc floor.
#
# One artefact and one installer. There is no package matrix and no emulated
# test matrix, because packaging/install.sh is what adapts to the target: it
# resolves the library dependencies through whatever package manager the machine
# has, and it builds from source whenever the prebuilt binary cannot run there.
# That covers every architecture and every distribution without this pipeline
# needing to know about any of them.
on:
  push:
    tags: ["v*"]
  # Buildable without publishing, to check the recipe before cutting a tag.
  workflow_dispatch:

# Least privilege: only the last job needs to write, and it says so itself.
permissions:
  contents: read

# One release build per tag. A re-pushed tag supersedes the run it started.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sigstore signs through a short-lived OIDC token minted for this run
      # rather than through a key this repository has to hold, rotate and not
      # lose. That is the whole reason attestations beat a minisign keypair
      # here, and it is why the job needs to mint one and to write the result.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with Cargo.toml would publish a tarball named after
      # one version containing another. The name comes from the crate version,
      # so the mismatch would be silent.
      - name: The tag and the crate version must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(packaging/version.sh)
          echo "tag=$tag crate=$crate"
          test "$crate" = "$tag" || {
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          }

      # Checked here, before the container build, because it costs a second and
      # the alternative is discovering after several minutes of compiling that
      # the release has nothing to say for itself. release-notes.sh exits
      # non-zero when the version has no section, which is what makes this a
      # gate rather than a formality.
      - name: The changelog must describe this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: packaging/release-notes.sh "${GITHUB_REF_NAME#v}" >/dev/null

      # install.sh is what every user runs, so a syntax error in it is a broken
      # release even when the tarball is perfect. It is a shell script, so this
      # is the whole of what can be checked without a machine to install onto.
      - name: Check the installer parses
        run: |
          sh -n packaging/install.sh
          sh packaging/install.sh --help >/dev/null

      # The same recipe that runs locally. `packaging/` is in the repo for this
      # reason: a second copy of the build steps written in YAML would drift.
      - name: Build the tarball
        run: packaging/build-tarball.sh

      # build-tarball.sh has already proved the binary *runs* and reports the
      # version the archive is named after, inside the Debian 12 container,
      # which is the only place it can be run: this runner is Ubuntu and has
      # librtlsdr.so.2 where the binary wants .so.0, the exact mismatch
      # install.sh exists to handle. So none of the checks below execute it.
      #
      # What is left is what the binary *is* and what it asks of a machine,
      # which the ELF headers answer without running anything.
      - name: Check what came out
        run: |
          out="$RUNNER_TEMP/unpacked"
          mkdir -p "$out"
          tar -xzf target/dist/*.tar.gz -C "$out"
          bin=$(find "$out" -name sdrtop -type f | head -1)
          [ -n "$bin" ] || { echo "::error::no sdrtop binary in the tarball"; exit 1; }
          file "$bin"
          readelf -h "$bin" | grep -q 'X86-64' || {
            echo "::error::the tarball does not contain an x86-64 binary"; exit 1; }

          # What the binary asks a machine for, asserted rather than printed.
          # The glibc floor below this was already checked while the library
          # list was only echoed into a log nobody reads, and that asymmetry was
          # the bug: if a future dependency pulls in a link to something Debian
          # 12 happens to have and a user's machine does not, the tarball
          # silently stops working for them with every check still green.
          #
          # Changing this list is a deliberate act, and the edit belongs in the
          # same commit as the dependency that caused it.
          expected="libc.so.6 libgcc_s.so.1 libhackrf.so.0 libm.so.6 librtlsdr.so.0"
          actual=$(readelf -d "$bin" \
            | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' | sort | tr '\n' ' ')
          actual=${actual% }
          echo "needs: $actual"
          test "$actual" = "$expected" || {
            echo "::error::the set of shared libraries changed"
            echo "::error::expected: $expected"
            echo "::error::actual:   $actual"
            exit 1; }

          # The floor this whole container exists to keep. If a newer base image
          # ever raises it, the tarball silently stops working on Debian 12.
          need=$(objdump -T "$bin" | sed -n 's/.*GLIBC_\([0-9.]*\).*/\1/p' | sort -V | tail -1)
          echo "highest glibc symbol required: $need"
          test "$(printf '%s\n2.37\n' "$need" | sort -V | tail -1)" = 2.37 || {
            echo "::error::binary needs glibc $need, above the Debian 12 floor"; exit 1; }

          # An unpacked tarball can install itself with no network, which only
          # works while it actually carries the installer.
          cmp -s "$out"/*/install.sh packaging/install.sh || {
            echo "::error::the tarball's install.sh is missing or out of date"; exit 1; }

      # Named globs rather than `*`, so the checksum file can never list itself
      # and an empty build directory fails here instead of producing an empty
      # SHA256SUMS that verifies nothing.
      #
      # These names are the checksums, and install.sh checks a download against
      # them. Renaming an asset after upload breaks that for everyone.
      - name: Collect the artefacts and their checksums
        run: |
          mkdir -p release
          cp target/dist/*.tar.gz release/
          cp packaging/install.sh release/
          cd release
          sha256sum -- *.tar.gz install.sh > SHA256SUMS
          cat SHA256SUMS

      # Signed provenance, which is a different claim from the checksums above.
      # SHA256SUMS proves a download was not corrupted in transit. It proves
      # nothing about where the file came from, because it is served from the
      # same place as the file and anyone who can write one can write the other.
      #
      # This binds each artefact's digest to this repository, this workflow file
      # and this commit, signed through Sigstore. A user checks it with:
      #
      #   gh attestation verify sdrtop-<version>-x86_64-unknown-linux-gnu.tar.gz \
      #      --repo musithang/sdrtop
      #
      # SHA256SUMS itself is not attested: it is derived from the two files that
      # are, so attesting it would add a third thing to keep in agreement and
      # prove nothing the other two do not already.
      #
      # Deliberately not gated on a tag. A workflow_dispatch run produces a real
      # attestation, which is the only way to exercise this before a release
      # depends on it working.
      - name: Attest what was built
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.tar.gz
            release/install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error

  # crates.io before GitHub, and the order is the whole point: the irreversible
  # step goes first, the recoverable one last. A failed release draft can be
  # retried; a published version can never be replaced, only yanked. Doing it
  # the other way round would mean a perfect release page pointing at a version
  # that failed to publish.
  publish:
    needs: build
    # Only a tag publishes. A manual run builds, checks, attests and stops.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing: crates.io trades a short-lived GitHub OIDC token for
      # a short-lived registry token, so no long-lived CRATES_IO_TOKEN has to
      # sit in this repository's secrets waiting to leak or expire.
      #
      # Configured once, on 2026-08-29, at crates.io/crates/sdrtop under
      # Settings, naming repository `musithang/sdrtop` and workflow
      # `release.yaml`. Two things there have to keep matching this file or the
      # token exchange is refused with an error that names neither:
      #
      #   - the workflow filename is `release.yaml`, with an `a`. Nearly every
      #     example in the wild says `release.yml`.
      #   - the Environment field is empty, so this job must have no
      #     `environment:` key. Adding one here means adding the same name
      #     there, and the reverse.
      #
      # Renaming this file therefore breaks publishing until the crates.io side
      # is edited to match.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # `cargo publish` runs a verification build, so the C libraries have to be
      # present. Publishing with --no-verify to dodge that would mean uploading
      # a version nobody proved compiles, which is the one thing here that
      # cannot be taken back.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libhackrf-dev librtlsdr-dev pkg-config libusb-1.0-0-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Exchange the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # Idempotent in the only sense available: a published version can never be
      # replaced, so "already there" and "done" are the same state. Without this
      # a rerun of the workflow would fail here over work that already
      # succeeded, after the whole build.
      #
      # The User-Agent is required, not politeness. crates.io answers 403 to a
      # request without one, and `curl -f` reports that the same way it reports
      # a 404, so a probe without it reads every version as unpublished and
      # tries to publish on every rerun. Verified: no UA gives 403 for a version
      # that plainly exists; with one, 200 for a published version and 404 for
      # an absent one.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=$(packaging/version.sh)
          probe="https://crates.io/api/v1/crates/sdrtop/$version"
          if curl -fsS -A "sdrtop-release-workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY)" \
               "$probe" >/dev/null; then
            echo "sdrtop $version is already on crates.io; nothing to do"
            exit 0
          fi
          cargo publish --locked

  release:
    needs: [build, publish]
    # Only a tag drafts a release. A manual run builds, checks and stops there.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release and upload to it
    steps:
      # Checked out for CHANGELOG.md and release-notes.sh, not to build
      # anything. The release body is written by a human and read back here.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Render the release notes from the changelog
        run: |
          packaging/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # A draft, always. Nothing is visible until a human has read the notes and
      # pressed Publish, which is also where the release text gets its final
      # pass. A prerelease was considered and rejected for the obvious reason:
      # it is public from the moment it exists, so that reading would happen on
      # a page anyone can already download from.
      #
      # The body comes from CHANGELOG.md, not from --generate-notes, which only
      # lists commit subjects. The build job already refused to get this far
      # without a section for this version.
      #
      # Idempotent, because the alternative is a rerun failing at the last step
      # after the whole build. The one thing it will not do is overwrite the
      # assets of a release that is already published: that is a live download
      # someone may already have a checksum for. Delete the release first if
      # that is genuinely what you want.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$REPO" \
                    --json isDraft -q .isDraft 2>/dev/null || echo missing)
          case "$draft" in
            missing)
              gh release create "$GITHUB_REF_NAME" \
                --repo "$REPO" \
                --draft \
                --verify-tag \
                --title "$GITHUB_REF_NAME" \
                --notes-file "$RUNNER_TEMP/notes.md" \
                release/*
              ;;
            true)
              echo "draft already exists, replacing its assets and notes"
              gh release edit "$GITHUB_REF_NAME" --repo "$REPO" \
                --notes-file "$RUNNER_TEMP/notes.md"
              gh release upload "$GITHUB_REF_NAME" --repo "$REPO" --clobber release/*
              ;;
            *)
              echo "::error::$GITHUB_REF_NAME is already published; refusing to overwrite its assets"
              exit 1
              ;;
          esac
