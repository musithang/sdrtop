name: Release

# Deliberately separate from ci.yaml. That runs on every push and must stay
# fast; this runs once per tag and takes half an hour, because it builds three
# architectures in a Debian 12 container.
on:
  push:
    tags: ["v*"]
  # Buildable without publishing, to check the recipe before cutting a tag.
  workflow_dispatch:

permissions:
  contents: write # to create the release and upload to it

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with Cargo.toml would publish artefacts named after
      # one version containing another. The .deb and the tarball both take their
      # name from the crate version, so the mismatch would be silent.
      - name: The tag and the crate version must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          echo "crate=$crate tag=$tag"
          test "$crate" = "$tag" || {
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          }

      # The same recipe that runs locally. `packaging/` is in the repo for this
      # reason: a second copy of the build steps written in YAML would drift.
      - name: Build the packages
        run: |
          for arch in amd64 arm64 armhf; do
            packaging/build-deb.sh "$arch"
          done
          packaging/build-tarball.sh

      # An arm64 package holding an x86-64 binary installs happily and then does
      # nothing. Nothing else in this pipeline would notice.
      - name: Verify each package
        run: |
          for deb in target/debian/*.deb; do
            packaging/verify-deb.sh "$deb"
          done

      - name: Collect the artefacts and their checksums
        run: |
          mkdir -p release
          cp target/debian/*.deb target/dist/*.tar.gz release/
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: release/

      # Only a tag drafts a release. A manual run builds and verifies and stops
      # there. A draft is never public until a human presses Publish, so the
      # title and the notes get written in the release editor, where they can be
      # read before anyone can download them.
      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release/*
