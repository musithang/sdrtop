[package]
name = "monas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "The engine inside sdrtop and monasd: the radio, its workers and their state. Internal; no stability promise."
readme = "README.md"

[features]
# The test fixtures other crates' tests build on: a state to draw panels
# from, a test radio, the native backends' test support. Switched on only
# from `[dev-dependencies]`, so no release build carries them.
testing = ["monas-ble/testing", "monas-bt/testing", "monas-dsp/testing", "monas-ft8/testing", "monas-wifi/testing"]

[dependencies]
monas-ble.workspace = true
monas-bt.workspace = true
monas-dsp.workspace = true
monas-ft8.workspace = true
monas-rds.workspace = true
monas-wifi.workspace = true
libc.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
rustfft.workspace = true
num-complex.workspace = true
libloading.workspace = true
serialport.workspace = true

[dev-dependencies]
# The building blocks' test kit, for this crate's own tests: a dependency's
# `cfg(test)` is off when its dependent's tests compile.
monas-ble = { workspace = true, features = ["testing"] }
monas-bt = { workspace = true, features = ["testing"] }
monas-dsp = { workspace = true, features = ["testing"] }
monas-ft8 = { workspace = true, features = ["testing"] }
monas-wifi = { workspace = true, features = ["testing"] }
