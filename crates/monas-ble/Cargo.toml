[package]
name = "monas-ble"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "sdrtop's Bluetooth LE receiver and measurements. Internal; no stability promise."
readme = "README.md"

[features]
# The transmitters and encoders other crates' tests build their packets with.
# Switched on only from `[dev-dependencies]`, so no release build carries
# them.
testing = ["monas-dsp/testing"]

[dependencies]
monas-dsp.workspace = true
num-complex.workspace = true
[dev-dependencies]
monas-dsp = { workspace = true, features = ["testing"] }
