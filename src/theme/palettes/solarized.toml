# Solarized Dark (https://ethanschoonover.com/solarized/).

name = "solarized"

border_dim     = "#073642"   # background panels: log, system resources, gains
border_default = "#586e75"   # ordinary instruments
border_accent  = "#268bd2"   # the spectrum and the waterfall
border_focused = "#fdf6e3"   # whichever panel is in focus mode
label          = "#586e75"   # quiet structure: "Frequency", "LNA gain"
value          = "#93a1a1"   # ordinary readings
value_hi       = "#b58900"   # the numbers that lead: frequency, total gain
status_ok      = "#859900"
status_warn    = "#b58900"
status_crit    = "#dc322f"
peak_hold      = "#b58900"   # the spectrum's peak-hold trace
noise_floor    = "#073642"   # the measured noise-floor rule
stale          = "#073642"   # [STALE] plates and the borders they cool
observer       = "#2aa198"   # observer mode, when another process holds the radio
net_ble        = "#d33682"   # decoded BLE packets, marked over the coexistence heatmap
net_bt         = "#fdf6e3"   # decoded classic Bluetooth hits, the same way
net_wifi       = "#8a5cff"   # Wi-Fi: its channel in the header, its frames wherever they are marked
wifi_non_ht    = "#268bd2"   # Wi-Fi frames by format, on every Wi-Fi view: 802.11a/g
wifi_ht        = "#d33682"   # 802.11n
wifi_vht       = "#2aa198"   # 802.11ac
wifi_he        = "#859900"   # 802.11ax
wifi_eht       = "#6c71c4"   # 802.11be
wifi_dsss      = "#b58900"   # 802.11b
wifi_other_channel = "#586e75"   # a frame of another channel heard here: quiet, as the label
wifi_undecoded = "#93a1a1"   # signalling that did not read
series         = ["#268bd2", "#b58900", "#d33682", "#2aa198", "#6c71c4", "#cb4b16"]   # one colour per piconet on the classic hop scatter, told apart from each other

pager_case     = "#073642"   # the pager's case
pager_edge     = "#586e75"   # its moulded edge
pager_bezel    = "#00212b"   # the bezel round its display
lcd_day_glass  = "#a1ac8a"   # the display by day: green STN glass
lcd_day_ink    = "#002b36"   # its ink
lcd_day_ghost  = "#99a383"   # an unlit dot, a shade off the glass
lcd_night_glass = "#1f1700"   # the display by night: an amber backlight
lcd_night_ink  = "#b58900"   # its ink
lcd_night_ghost = "#271d02"   # an unlit dot
map_land       = "#586e75"   # the FT8 map: land by day
map_night      = "#1d4a55"   # land by night
map_greyline   = "#c06ad8"   # the grey line, its own ink, never a station's
map_grid       = "#073642"   # range rings and the locator grid
map_home       = "#2aa198"   # you, at the middle, never a station's ink

# The spectrum and waterfall gradient, cold (weak) to hot (strong).
# `at` is the position in 0.0..1.0; the stops must climb.
palette = [
    { at = 0.00,  color = "#002b36" },
    { at = 0.25,  color = "#268bd2" },
    { at = 0.48,  color = "#2aa198" },
    { at = 0.63,  color = "#859900" },
    { at = 0.80,  color = "#b58900" },
    { at = 1.00,  color = "#dc322f" },
]
