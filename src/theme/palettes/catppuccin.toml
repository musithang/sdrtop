# Catppuccin Mocha (https://catppuccin.com/).

name = "catppuccin"

border_dim     = "#313244"   # background panels: log, system resources, gains
border_default = "#585b70"   # ordinary instruments
border_accent  = "#cba6f7"   # the spectrum and the waterfall
border_focused = "#cdd6f4"   # whichever panel is in focus mode
label          = "#585b70"   # quiet structure: "Frequency", "LNA gain"
value          = "#cdd6f4"   # ordinary readings
value_hi       = "#f9e2af"   # the numbers that lead: frequency, total gain
status_ok      = "#a6e3a1"
status_warn    = "#f9e2af"
status_crit    = "#f38ba8"
peak_hold      = "#f9e2af"   # the spectrum's peak-hold trace
noise_floor    = "#313244"   # the measured noise-floor rule
stale          = "#313244"   # [STALE] plates and the borders they cool
observer       = "#89dceb"   # observer mode, when another process holds the radio
net_ble        = "#cba6f7"   # decoded BLE packets, marked over the coexistence heatmap
net_bt         = "#ffffff"   # decoded classic Bluetooth hits, the same way
net_wifi       = "#8a5cff"   # Wi-Fi: its channel in the header, its frames wherever they are marked
wifi_non_ht    = "#74c7ec"   # Wi-Fi frames by format, on every Wi-Fi view: 802.11a/g
wifi_ht        = "#cba6f7"   # 802.11n
wifi_vht       = "#94e2d5"   # 802.11ac
wifi_he        = "#a6e3a1"   # 802.11ax
wifi_eht       = "#f5c2e7"   # 802.11be
wifi_dsss      = "#fab387"   # 802.11b
wifi_other_channel = "#585b70"   # a frame of another channel heard here: quiet, as the label
wifi_undecoded = "#cdd6f4"   # signalling that did not read
series         = ["#74c7ec", "#f9e2af", "#f5c2e7", "#a6e3a1", "#b4befe", "#f38ba8"]   # one colour per piconet on the classic hop scatter, told apart from each other

pager_case     = "#313244"   # the pager's case
pager_edge     = "#45475a"   # its moulded edge
pager_bezel    = "#11111b"   # the bezel round its display
lcd_day_glass  = "#a3b896"   # the display by day: green STN glass
lcd_day_ink    = "#1e1e2e"   # its ink
lcd_day_ghost  = "#9baf8f"   # an unlit dot, a shade off the glass
lcd_night_glass = "#231d14"   # the display by night: an amber backlight
lcd_night_ink  = "#f9e2af"   # its ink
lcd_night_ghost = "#2a2318"   # an unlit dot
map_land       = "#7f849c"   # the FT8 map: land by day
map_night      = "#5a5c75"   # land by night
map_greyline   = "#c06ad8"   # the grey line, its own ink, never a station's
map_grid       = "#313244"   # range rings and the locator grid
map_home       = "#a6e3a1"   # you, at the middle, never a station's ink

# The spectrum and waterfall gradient, cold (weak) to hot (strong).
# `at` is the position in 0.0..1.0; the stops must climb.
palette = [
    { at = 0.00,  color = "#1e1e2e" },
    { at = 0.25,  color = "#74c7ec" },
    { at = 0.48,  color = "#89dceb" },
    { at = 0.63,  color = "#a6e3a1" },
    { at = 0.80,  color = "#f9e2af" },
    { at = 1.00,  color = "#f38ba8" },
]
