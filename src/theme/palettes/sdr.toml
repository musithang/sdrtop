# Default theme, designed for sdrtop: deep black background, sharp cyan
# accent, orange highlighted values, lime-to-red spectrum gradient.

name = "sdr"

border_dim     = "#57607a"   # background panels: log, system resources, gains
border_default = "#3c7891"   # ordinary instruments
border_accent  = "#00d7ff"   # the spectrum and the waterfall
border_focused = "#ffffff"   # whichever panel is in focus mode
label          = "#8296b2"   # quiet structure: "Frequency", "LNA gain"
value          = "#c3d2dc"   # ordinary readings
value_hi       = "#ffaf00"   # the numbers that lead: frequency, total gain
status_ok      = "#00d282"
status_warn    = "#ffaf00"
status_crit    = "#ff5a5a"
peak_hold      = "#ffd700"   # the spectrum's peak-hold trace
noise_floor    = "#505f78"   # the measured noise-floor rule
stale          = "#3c414b"   # [STALE] plates and the borders they cool
observer       = "#6496ff"   # observer mode, when another process holds the radio
net_ble        = "#ff5fd7"   # decoded BLE packets, marked over the coexistence heatmap
net_bt         = "#ffffff"   # decoded classic Bluetooth hits, the same way
net_wifi       = "#8a5cff"   # Wi-Fi: its channel in the header, its frames wherever they are marked
wifi_non_ht    = "#00afff"   # Wi-Fi frames by format, on every Wi-Fi view: 802.11a/g
wifi_ht        = "#af5fff"   # 802.11n
wifi_vht       = "#00d7af"   # 802.11ac
wifi_he        = "#afff00"   # 802.11ax
wifi_eht       = "#ff5faf"   # 802.11be
wifi_dsss      = "#ff8700"   # 802.11b
wifi_other_channel = "#8296b2"   # a frame of another channel heard here: quiet, as the label
wifi_undecoded = "#c3d2dc"   # signalling that did not read
series         = ["#00d7ff", "#ffaf00", "#ff5fd7", "#00d282", "#af87ff", "#ffd75f"]   # one colour per piconet on the classic hop scatter, told apart from each other

pager_case     = "#22262e"   # the pager's case
pager_edge     = "#343a45"   # its moulded edge
pager_bezel    = "#0f1115"   # the bezel round its display
lcd_day_glass  = "#9aab88"   # the display by day: green STN glass
lcd_day_ink    = "#18241a"   # its ink
lcd_day_ghost  = "#93a482"   # an unlit dot, a shade off the glass
lcd_night_glass = "#1c1300"   # the display by night: an amber backlight
lcd_night_ink  = "#ffb400"   # its ink
lcd_night_ghost = "#231802"   # an unlit dot
map_land       = "#4a8eab"   # the FT8 map: land by day
map_night      = "#546c8a"   # land by night
map_greyline   = "#d070c8"   # the grey line, its own ink, never a station's
map_grid       = "#3a4152"   # range rings and the locator grid
map_home       = "#00d282"   # you, at the middle, never a station's ink

# The spectrum and waterfall gradient, cold (weak) to hot (strong).
# `at` is the position in 0.0..1.0; the stops must climb.
palette = [
    { at = 0.00,  color = "#0a0a50" },
    { at = 0.25,  color = "#0050b4" },
    { at = 0.45,  color = "#00d2d2" },
    { at = 0.60,  color = "#00d250" },
    { at = 0.78,  color = "#ffd700" },
    { at = 1.00,  color = "#ff3214" },
]
