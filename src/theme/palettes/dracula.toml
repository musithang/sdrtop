# Dracula (https://draculatheme.com/).

name = "dracula"

border_dim     = "#44475a"   # background panels: log, system resources, gains
border_default = "#6272a4"   # ordinary instruments
border_accent  = "#bd93f9"   # the spectrum and the waterfall
border_focused = "#f8f8f2"   # whichever panel is in focus mode
label          = "#6272a4"   # quiet structure: "Frequency", "LNA gain"
value          = "#f8f8f2"   # ordinary readings
value_hi       = "#f1fa8c"   # the numbers that lead: frequency, total gain
status_ok      = "#50fa7b"
status_warn    = "#ffb86c"
status_crit    = "#ff5555"
peak_hold      = "#f1fa8c"   # the spectrum's peak-hold trace
noise_floor    = "#44475a"   # the measured noise-floor rule
stale          = "#44475a"   # [STALE] plates and the borders they cool
observer       = "#8be9fd"   # observer mode, when another process holds the radio
net_ble        = "#ff79c6"   # decoded BLE packets, marked over the coexistence heatmap
net_bt         = "#f8f8f2"   # decoded classic Bluetooth hits, the same way
net_wifi       = "#8a5cff"   # Wi-Fi: its channel in the header, its frames wherever they are marked
wifi_non_ht    = "#8be9fd"   # Wi-Fi frames by format, on every Wi-Fi view: 802.11a/g
wifi_ht        = "#bd93f9"   # 802.11n
wifi_vht       = "#50fa7b"   # 802.11ac
wifi_he        = "#f1fa8c"   # 802.11ax
wifi_eht       = "#ff79c6"   # 802.11be
wifi_dsss      = "#ffb86c"   # 802.11b
wifi_other_channel = "#6272a4"   # a frame of another channel heard here: quiet, as the label
wifi_undecoded = "#f8f8f2"   # signalling that did not read
series         = ["#8be9fd", "#f1fa8c", "#ff79c6", "#50fa7b", "#bd93f9", "#ffb86c"]   # one colour per piconet on the classic hop scatter, told apart from each other

pager_case     = "#343746"   # the pager's case
pager_edge     = "#44475a"   # its moulded edge
pager_bezel    = "#191a21"   # the bezel round its display
lcd_day_glass  = "#a4b896"   # the display by day: green STN glass
lcd_day_ink    = "#21222c"   # its ink
lcd_day_ghost  = "#9caf8f"   # an unlit dot, a shade off the glass
lcd_night_glass = "#241a0e"   # the display by night: an amber backlight
lcd_night_ink  = "#ffb86c"   # its ink
lcd_night_ghost = "#2b2012"   # an unlit dot

# The spectrum and waterfall gradient, cold (weak) to hot (strong).
# `at` is the position in 0.0..1.0; the stops must climb.
palette = [
    { at = 0.00,  color = "#282a36" },
    { at = 0.25,  color = "#6272a4" },
    { at = 0.48,  color = "#8be9fd" },
    { at = 0.63,  color = "#50fa7b" },
    { at = 0.80,  color = "#ffb86c" },
    { at = 1.00,  color = "#ff5555" },
]
