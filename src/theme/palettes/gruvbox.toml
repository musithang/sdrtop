# Gruvbox Dark (https://github.com/morhetz/gruvbox).

name = "gruvbox"

border_dim     = "#3c3836"   # background panels: log, system resources, gains
border_default = "#665c54"   # ordinary instruments
border_accent  = "#d79921"   # the spectrum and the waterfall
border_focused = "#ebdbb2"   # whichever panel is in focus mode
label          = "#665c54"   # quiet structure: "Frequency", "LNA gain"
value          = "#d5c4a1"   # ordinary readings
value_hi       = "#fabd2f"   # the numbers that lead: frequency, total gain
status_ok      = "#98971a"
status_warn    = "#d79921"
status_crit    = "#cc241d"
peak_hold      = "#fabd2f"   # the spectrum's peak-hold trace
noise_floor    = "#3c3836"   # the measured noise-floor rule
stale          = "#3c3836"   # [STALE] plates and the borders they cool
observer       = "#458588"   # observer mode, when another process holds the radio
net_ble        = "#d3869b"   # decoded BLE packets, marked over the coexistence heatmap
net_bt         = "#ebdbb2"   # decoded classic Bluetooth hits, the same way
net_wifi       = "#8a5cff"   # Wi-Fi: its channel in the header, its frames wherever they are marked
wifi_non_ht    = "#83a598"   # Wi-Fi frames by format, on every Wi-Fi view: 802.11a/g
wifi_ht        = "#b16286"   # 802.11n
wifi_vht       = "#8ec07c"   # 802.11ac
wifi_he        = "#b8bb26"   # 802.11ax
wifi_eht       = "#d3869b"   # 802.11be
wifi_dsss      = "#fe8019"   # 802.11b
wifi_other_channel = "#665c54"   # a frame of another channel heard here: quiet, as the label
wifi_undecoded = "#d5c4a1"   # signalling that did not read
series         = ["#83a598", "#fabd2f", "#d3869b", "#b8bb26", "#fe8019", "#458588"]   # one colour per piconet on the classic hop scatter, told apart from each other

pager_case     = "#3c3836"   # the pager's case
pager_edge     = "#504945"   # its moulded edge
pager_bezel    = "#1d2021"   # the bezel round its display
lcd_day_glass  = "#a8a878"   # the display by day: green STN glass
lcd_day_ink    = "#282828"   # its ink
lcd_day_ghost  = "#a0a072"   # an unlit dot, a shade off the glass
lcd_night_glass = "#251a05"   # the display by night: an amber backlight
lcd_night_ink  = "#fabd2f"   # its ink
lcd_night_ghost = "#2c2008"   # an unlit dot
map_land       = "#665c54"   # the FT8 map: land by day
map_night      = "#504945"   # land by night
map_greyline   = "#b16286"   # the grey line, its own ink, never a station's
map_grid       = "#3c3836"   # range rings and the locator grid

# The spectrum and waterfall gradient, cold (weak) to hot (strong).
# `at` is the position in 0.0..1.0; the stops must climb.
palette = [
    { at = 0.00,  color = "#282828" },
    { at = 0.25,  color = "#458588" },
    { at = 0.48,  color = "#98971a" },
    { at = 0.63,  color = "#d79921" },
    { at = 0.80,  color = "#d65d0e" },
    { at = 1.00,  color = "#cc241d" },
]
