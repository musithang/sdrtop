# NET BLE — what is this device advertising, and is its own transmitter any
# good? Design section 9's question for this preset. Real advertising channel
# PDUs, CRC-checked, as they arrive, beside the detail of the one selected
# (focus the list with v): its header, its physics and its modulation.
#
# Needs the radio on a BLE channel - one of the three advertising
# frequencies, 2402, 2426 or 2480 MHz, for ordinary advertising - and a sample
# rate the decoder can reach its working rate from. P on the list switches
# between LE 1M and LE 2M; LE 2M is never sent on the three advertising
# channels, and the panels say so there. Both panels say when either
# condition is not met, rather than showing an empty table that could be
# mistaken for a quiet room.

section = "net"
slot    = 4
title   = "BLE"
blurb   = "what is this device advertising"

panels = [
    { name = "header",          position = "top", height = 5 },
    { name = "net_ble_packets", position = "body" },
    { name = "net_ble_detail",  position = "right", width_pct = 34 },
    { name = "log",             position = "bottom", height = 5 },
    { name = "footer",          position = "bottom" },
]
