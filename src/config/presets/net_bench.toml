# Classic Bench: one piconet, each end of it side by side. The piconet is the
# one selected in the Piconets view (the selection is the section's,
# `NetState::bt_view`), and `3` opens it here as `Enter` and `2` open the
# packet list. Three sections, MODULATION, CARRIER and TIMING, each end's
# figures against the limits they are held to, with room on a screen of
# their own for the plots: the master in the piconet's colour, the slave in
# the ordinary ink. The classic receiver runs here exactly as on the
# Piconets view (`signal::net::lock::CLASSIC_VIEWS`).

section = "classic"
slot    = 3
title   = "Bench"
blurb   = "each end of one piconet, side by side"
about   = "Both ends of one classic link side by side: what each transmitter is doing, and how well."

panels = [
    { name = "header",       position = "top", height = 5 },
    { name = "net_bt_bench", position = "body" },
    { name = "log",          position = "bottom", height = 5 },
    { name = "footer",       position = "bottom" },
]
