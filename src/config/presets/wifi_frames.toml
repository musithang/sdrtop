# What is on this channel, frame by frame, a capture at a time, as an
# oscilloscope takes them: a window of air set off by a trigger (any frame,
# or one kind) and held still until the next, after a holdoff. The river
# draws the capture as lanes of frames at 1 ms, 40 us or 4 us a cell; under
# it the capture's frames in time order, what was read of each, their time
# from the trigger. Beside them the card: this channel's frames a second
# over everything heard, by format, and the selected frame field by field;
# `d` turns it to the account of every preamble found. The list's focus
# (e) selects a frame (stopping the captures), steps the scale, the trigger
# and the holdoff. No Bluetooth receiver runs on it.

section = "wifi_channel"
slot    = 2
title   = "Frames"
blurb   = "what is on this channel, frame by frame"

panels = [
    { name = "header",          position = "top", height = 5 },
    { name = "net_wifi_river",  position = "body" },
    { name = "net_wifi_frames", position = "body" },
    { name = "net_wifi_card",   position = "right", width_pct = 36 },
    { name = "log",             position = "bottom", height = 5 },
    { name = "footer",          position = "bottom" },
]
