# What is on this channel, frame by frame: the river, the channel's time as
# lanes of frames at 1 ms, 40 us or 4 us a cell; under it every frame heard
# on the channel's centre, newest first, with what was read of it (its
# format and signalling, the gap before it, its airtime, offset and SNR)
# and another channel's frames by how far away they are. Beside them the
# card: this channel's frames a second over whole seconds, by format, and
# the selected frame field by field, its clock and its channel; `d` turns
# it to the account of every preamble found. The list's focus (e) holds the
# list and the river, selects a frame and steps the river's zoom. No
# Bluetooth receiver runs on it.

section = "wifi_channel"
slot    = 2
title   = "Frames"
blurb   = "what is on this channel, frame by frame"

panels = [
    { name = "header",          position = "top", height = 5 },
    { name = "net_wifi_river",  position = "body" },
    { name = "net_wifi_frames", position = "body" },
    { name = "net_wifi_card",   position = "right", width_pct = 36 },
    { name = "log",             position = "bottom", height = 5 },
    { name = "footer",          position = "bottom" },
]
