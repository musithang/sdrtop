# NET Census — who is here? Design section 9.3: one screen, one question. The
# population of the band, one row per transmitter, ordered by whichever column
# you pick.
#
# Filled by BLE while it has a channel. Empty, the panel says which of the two
# empties it is: nobody counting, or a room that stayed quiet. Under the table,
# every clock on a null meter, worst first, and the selected device's detail,
# each drawn when it fits.

section = "net"
slot    = 3
title   = "Census"
blurb   = "who is here"

panels = [
    { name = "header",     position = "top", height = 5 },
    { name = "net_census", position = "body" },
    { name = "log",        position = "bottom", height = 5 },
    { name = "footer",     position = "bottom" },
]
