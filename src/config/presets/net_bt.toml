# NET Classic — who is here, the old way? B14's own question: classic
# Bluetooth has no small, fixed set of channels to gate on the way BLE's
# three advertising ones do, so this preset exists to be the thing a user
# picks to mean "point the radio at classic Bluetooth" - the same job
# `net_ble`'s own preset name already does for BLE.
#
# B15 gave this preset a live receiver. `net_bt_hops` shows its access-code
# hits as two answers: WHERE, all 79 channels with each one's hits this
# session and the channels watched now underlined, and WHEN, one lane per
# piconet ticking its hits in a window that zooms and scrubs (net-ux-polish-
# plan 6.2, rebuilt from a scatter that a sparse live room left nearly
# empty). `net_bt_piconets` beside it is the roster,
# one row per LAP heard, and the selected piconet spelled out
# (net-ux-polish-plan 6.1); it replaced a placeholder that only said the
# LAPs were not yet counted. Each piconet wears one colour in both, and one
# selection drives both (6.2).

section = "net"
slot    = 5
title   = "Classic"
blurb   = "who is here, the old way"

panels = [
    { name = "header",        position = "top", height = 5 },
    { name = "net_bt_hops",   position = "body" },
    { name = "net_bt_piconets", position = "right", width_pct = 38 },
    { name = "log",           position = "bottom", height = 5 },
    { name = "footer",        position = "bottom" },
]
