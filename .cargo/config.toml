# A bare `cargo run` cannot pick between the workspace's binaries; these name
# them. `cargo sdrtop -- --device hackrf` is `cargo run -p sdrtop -- --device hackrf`.
[alias]
sdrtop = "run -p sdrtop --"
monasd = "run -p monasd --"
